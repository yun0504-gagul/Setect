name: Build SeTeukCheck APK & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate App Source Files (www/index.html)
        run: |
          mkdir -p www
          cat << 'EOF_HTML' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <meta name="theme-color" content="#1e3a8a" />
            <title>세특체크 — 과목별 과세특 등록 · 통합 열람 · 핵심 키워드 중복 검사</title>
            <!-- 다중 파일 파서 (Excel, DOCX, PDF, HWP/HWPX) -->
            <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/cfb.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
            <style>
              :root {
                --bg: #f8fafc;
                --surface: #ffffff;
                --surface-subtle: #f1f5f9;
                --border: #e2e8f0;
                --text: #0f172a;
                --text-muted: #475569;
                --primary: #2563eb;
                --primary-hover: #1d4ed8;
                --primary-soft: #dbeafe;
                --danger: #dc2626;
                --danger-soft: #fef2f2;
                --danger-border: #fecaca;
                --warn: #d97706;
                --warn-soft: #fffbeb;
                --warn-border: #fde68a;
                --safe: #059669;
                --safe-soft: #ecfdf5;
                --safe-border: #a7f3d0;
                --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
                --radius: 14px;
              }

              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
              body {
                font-family: system-ui, -apple-system, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
                min-height: 100vh;
                padding-bottom: 40px;
              }

              header {
                background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
                color: #fff;
                padding: 18px 16px;
                position: sticky;
                top: 0;
                z-index: 50;
                box-shadow: 0 2px 12px rgba(15, 23, 42, 0.2);
              }
              .header-inner {
                max-width: 1180px;
                margin: 0 auto;
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
              }
              .brand { display: flex; align-items: center; gap: 11px; }
              .brand-badge {
                width: 38px; height: 38px; border-radius: 10px;
                background: #3b82f6; display: flex; align-items: center; justify-content: center;
                font-weight: 800; font-size: 18px; flex-shrink: 0;
              }
              .brand h1 { font-size: 18.5px; font-weight: 800; }
              .brand p { font-size: 11.5px; color: #cbd5e1; }
              .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

              .btn {
                display: inline-flex; align-items: center; justify-content: center; gap: 5px;
                padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 700;
                cursor: pointer; border: 1px solid transparent; transition: 0.15s;
              }
              .btn-primary { background: var(--primary); color: #fff; }
              .btn-primary:hover { background: var(--primary-hover); }
              .btn-glass { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.22); }
              .btn-outline { background: #fff; color: var(--text); border-color: var(--border); }
              .btn-danger-outline { background: #fff; color: var(--danger); border-color: var(--danger-border); }

              .container {
                max-width: 1180px;
                margin: 18px auto 40px;
                padding: 0 14px;
                display: grid;
                grid-template-columns: 1.1fr 0.9fr;
                gap: 18px;
                align-items: start;
              }
              @media (max-width: 940px) { .container { grid-template-columns: 1fr; } }

              .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 18px;
                margin-bottom: 16px;
              }
              .card-title {
                font-size: 16px; font-weight: 800; margin-bottom: 6px;
                display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
              }
              .card-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 13px; }

              .subject-selector-box {
                background: #f8fafc;
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 12px;
                margin-bottom: 12px;
              }
              .subject-selector-label {
                font-size: 12px; font-weight: 800; color: #1e3a8a; margin-bottom: 7px;
                display: flex; align-items: center; justify-content: space-between;
              }
              .preset-chips {
                display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px;
              }
              .preset-chip {
                font-size: 11.5px; padding: 4px 9px; border-radius: 999px;
                background: #fff; color: #334155; border: 1px solid var(--border);
                cursor: pointer; font-weight: 600; transition: 0.12s;
              }
              .preset-chip.active, .preset-chip:hover {
                background: var(--primary); color: #fff; border-color: var(--primary);
              }

              .search-box { display: flex; flex-direction: column; gap: 10px; }
              .search-input-wrap { display: flex; gap: 8px; }
              .search-input {
                flex: 1; padding: 12px 14px; font-size: 15px;
                border: 2px solid var(--border); border-radius: 11px; outline: none;
              }
              .search-input:focus { border-color: var(--primary); }
              .search-options {
                display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                font-size: 12.5px; color: var(--text-muted);
              }
              .search-options select, .search-options input {
                padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; background: #fff;
              }

              .verdict-card { border-radius: 12px; padding: 15px 16px; margin-top: 14px; border: 1px solid transparent; }
              .verdict-danger { background: var(--danger-soft); border-color: var(--danger-border); color: #7f1d1d; }
              .verdict-warn { background: var(--warn-soft); border-color: var(--warn-border); color: #78350f; }
              .verdict-safe { background: var(--safe-soft); border-color: var(--safe-border); color: #064e3b; }
              .verdict-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
              .verdict-badge { font-weight: 800; font-size: 14.5px; }
              .verdict-score { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,0.8); }

              .match-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
              .match-item, .record-card {
                background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 13px;
              }
              .match-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
              .tag {
                display: inline-block; padding: 2px 8px; border-radius: 6px;
                font-size: 11.5px; font-weight: 700; background: var(--primary-soft); color: var(--primary);
              }
              .tag-grade { background: #e2e8f0; color: #334155; }
              .match-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; color: #0f172a; }
              .match-content { font-size: 13px; color: var(--text-muted); white-space: pre-line; }
              mark.hl { background: #fef08a; color: #713f12; font-weight: 700; padding: 0 3px; border-radius: 3px; }

              .suggestion-box {
                margin-top: 14px; background: #f8fafc; border: 1px solid #cbd5e1;
                border-radius: 12px; padding: 14px;
              }
              .suggestion-box h3 { font-size: 14px; font-weight: 800; color: #1e3a8a; margin-bottom: 9px; }
              .suggestion-list { display: flex; flex-direction: column; gap: 9px; }
              .suggestion-item {
                background: #fff; border-left: 4px solid var(--primary);
                padding: 10px 12px; border-radius: 8px;
              }
              .suggestion-item strong { display: block; font-size: 13px; margin-bottom: 2px; }
              .suggestion-item p { font-size: 12.5px; color: var(--text-muted); }

              .dropzone {
                display: block; border: 2px dashed #94a3b8; border-radius: 12px;
                padding: 16px 12px; text-align: center; background: #f8fafc;
                cursor: pointer; transition: 0.15s; margin-bottom: 10px;
              }
              .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: #eff6ff; }
              .dropzone-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
              .dropzone-sub { font-size: 11.5px; color: var(--text-muted); }

              .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
              .tab-btn {
                padding: 7px 10px; font-size: 12.5px; font-weight: 700; color: var(--text-muted);
                background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
              }
              .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

              .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
              .input, .textarea {
                width: 100%; padding: 8px 11px; border: 1px solid var(--border);
                border-radius: 8px; font-size: 13px; font-family: inherit;
              }
              .textarea { min-height: 88px; resize: vertical; margin-bottom: 8px; }

              .view-mode-bar {
                display: flex; gap: 5px; background: var(--surface-subtle);
                padding: 4px; border-radius: 10px; margin-bottom: 10px;
              }
              .view-mode-btn {
                flex: 1; padding: 6px 8px; font-size: 12px; font-weight: 700;
                border: none; border-radius: 7px; cursor: pointer;
                background: transparent; color: var(--text-muted); transition: 0.15s;
              }
              .view-mode-btn.active {
                background: #fff; color: var(--primary); box-shadow: 0 1px 4px rgba(15,23,42,0.08);
              }

              .subject-filter-bar {
                display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px;
              }
              .subj-filter-chip {
                font-size: 11.5px; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
                border: 1px solid var(--border); background: #fff; color: var(--text-muted);
                cursor: pointer; font-weight: 700;
              }
              .subj-filter-chip.active {
                background: #1e3a8a; color: #fff; border-color: #1e3a8a;
              }

              .records-scroll {
                max-height: 540px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
              }
              .merged-doc-box {
                background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px;
              }
              .merged-subj-section {
                background: #fff; border: 1px solid var(--border); border-radius: 10px;
                padding: 13px; margin-bottom: 10px;
              }
              .merged-subj-section:last-child { margin-bottom: 0; }
              .merged-subj-header {
                display: flex; align-items: center; justify-content: space-between;
                border-bottom: 1px solid var(--surface-subtle); padding-bottom: 7px; margin-bottom: 8px;
              }
              .merged-subj-title {
                font-size: 14.5px; font-weight: 800; color: #1e3a8a; display: flex; align-items: center; gap: 6px;
              }
              .merged-entry {
                padding: 7px 0; border-bottom: 1px dashed #e2e8f0; font-size: 13px;
              }
              .merged-entry:last-child { border-bottom: none; padding-bottom: 0; }

              .record-del {
                background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 11.5px; font-weight: 700;
              }
              .record-del:hover { color: var(--danger); }

              .keywords-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
              .kw-chip {
                display: inline-flex; align-items: center; gap: 4px;
                font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
                background: var(--surface-subtle); color: #1e293b; cursor: pointer; border: 1px solid var(--border);
                font-weight: 600;
              }
              .kw-chip:hover { background: var(--primary-soft); color: var(--primary); border-color: #93c5fd; }
              .kw-chip-del {
                font-size: 10px; color: #94a3b8; padding-left: 2px; font-weight: 800;
              }
              .kw-chip-del:hover { color: var(--danger); }

              .status-toast { font-size: 12px; color: var(--primary); font-weight: 700; margin-top: 6px; min-height: 18px; }
            </style>
          </head>
          <body>
            <header>
              <div class="header-inner">
                <div class="brand">
                  <div class="brand-badge">세</div>
                  <div>
                    <h1>세특체크 (SeTeuk Check)</h1>
                    <p>과목별 추가 · 전체 통합 열람 · 핵심 학술 키워드 선별 & 중복 검사</p>
                  </div>
                </div>
                <div class="header-actions">
                  <button class="btn btn-glass" onclick="loadSampleData()">✨ 예시 불러오기</button>
                  <button class="btn btn-glass" onclick="exportBackupJSON()">💾 JSON 백업</button>
                  <label class="btn btn-glass" style="cursor:pointer;">
                    📂 백업 복원
                    <input type="file" accept=".json" style="display:none" onchange="importBackupJSON(event)" />
                  </label>
                </div>
              </div>
            </header>

            <main class="container">
              <!-- 좌측: 주제 중복 검사 및 핵심 학술 키워드 맵 -->
              <section>
                <div class="card">
                  <div class="card-title">
                    <span>🔍 새 탐구 주제 중복 검사 & 심화 추천</span>
                  </div>
                  <p class="card-desc">
                    새로 계획 중인 보고서·발표 주제를 입력하면 과목별로 등록된 모든 과세특을 합쳐서 비교하고, 겹치지 않는 심화 주제를 추천합니다.
                  </p>

                  <div class="search-box">
                    <div class="search-input-wrap">
                      <input
                        type="text"
                        id="topicInput"
                        class="search-input"
                        placeholder="예: 인공지능 추천 알고리즘 편향성, 카탈레이스 효소 반응 속도..."
                        onkeydown="if(event.key==='Enter') checkTopic()"
                      />
                      <button class="btn btn-primary" onclick="checkTopic()">검사</button>
                    </div>

                    <div class="search-options">
                      <label>작성 예정 과목:</label>
                      <input type="text" id="targetSubjectInput" placeholder="예: 확률과 통계, 생명과학II" style="width:160px;" />
                      <label>희망 계열:</label>
                      <select id="careerTrackSelect" onchange="if(document.getElementById('topicInput').value) checkTopic()">
                        <option value="all">전체 / 융합 계열</option>
                        <option value="it">IT · 컴퓨터 · AI · 데이터</option>
                        <option value="bio">의학 · 간호 · 약학 · 생명 · 화학</option>
                        <option value="eng">기계 · 전자 · 신소재 · 공학</option>
                        <option value="soc">경영 · 경제 · 사회 · 법학</option>
                        <option value="hum">인문 · 교육 · 미디어 · 어문</option>
                      </select>
                    </div>

                    <div style="display:flex; gap:5px; flex-wrap:wrap; align-items:center;">
                      <span style="font-size:11.5px; color:var(--text-muted);">빠른 테스트:</span>
                      <button class="kw-chip" onclick="quickCheck('인공지능 추천 알고리즘의 필터버블과 편향성')">인공지능 알고리즘 편향성</button>
                      <button class="kw-chip" onclick="quickCheck('조건부확률과 베이즈 정리를 활용한 진단 키트')">베이즈 정리 진단 키트</button>
                      <button class="kw-chip" onclick="quickCheck('카탈레이스 효소 반응 속도와 활성화 에너지')">카탈레이스 효소 반응</button>
                    </div>
                  </div>

                  <div id="checkResultArea"></div>
                </div>

                <!-- 쓸모 있는 학술 키워드만 모아둔 카드 -->
                <div class="card">
                  <div class="card-title">
                    <span>🎯 추출된 핵심 학술 키워드 (쓸모 있는 키워드만 선별)</span>
                    <button class="btn btn-outline" style="padding:3px 8px; font-size:11px;" onclick="resetIgnoredKeywords()">숨긴 키워드 복원</button>
                  </div>
                  <p class="card-desc" style="margin-bottom:8px;">
                    일반 서술어(탐구함, 이해함, 모둠활동 등)는 자동 제외하고 <strong>교과 개념·전문 용어·실험/이론 키워드</strong>만 추출합니다. 필요 없는 단어는 <strong>✕</strong>를 눌러 영구 제외하거나 직접 추가할 수 있습니다.
                  </p>
                  <div style="display:flex; gap:6px; margin-bottom:10px;">
                    <input type="text" id="customKeywordInput" class="input" placeholder="중요 키워드 직접 추가 (예: 베이즈정리, 카탈레이스)" onkeydown="if(event.key==='Enter') addCustomKeyword()" />
                    <button class="btn btn-outline" style="white-space:nowrap;" onclick="addCustomKeyword()">+ 키워드 추가</button>
                  </div>
                  <div id="keywordCloud" class="keywords-row"></div>
                </div>
              </section>

              <!-- 우측: 과목별 추가 및 통합 열람 -->
              <aside>
                <div class="card">
                  <div class="card-title">📂 과목별 과세특 추가 (파일 · 텍스트 · 직접 입력)</div>
                  <p class="card-desc">
                    위에서 <strong>등록할 과목(및 학년)</strong>을 선택한 뒤 한글(HWP/HWPX)·엑셀·PDF·워드 파일을 올리거나 텍스트를 입력하면 해당 과목으로 차곡차곡 추가됩니다.
                  </p>

                  <!-- 공통 과목/학년 지정 박스 -->
                  <div class="subject-selector-box">
                    <div class="subject-selector-label">
                      <span>📌 1단계: 추가할 과목 선택 또는 직접 입력</span>
                      <span style="font-size:11px; color:var(--text-muted); font-weight:500;">파일/텍스트 등록 시 이 과목으로 들어가요</span>
                    </div>
                    <div class="preset-chips" id="presetSubjectChips"></div>
                    <div class="form-row" style="margin-bottom:0;">
                      <input type="text" id="activeGradeInput" class="input" placeholder="학년/학기 (예: 2학년 1학기)" value="2학년 1학기" />
                      <input type="text" id="activeSubjectInput" class="input" placeholder="과목명 직접 입력 (예: 생명과학I)" value="통합과학" oninput="syncPresetHighlight()" />
                    </div>
                  </div>

                  <div class="tabs">
                    <button class="tab-btn active" id="tabBtnFile" onclick="switchTab('file')">파일 업로드 (HWP 등)</button>
                    <button class="tab-btn" id="tabBtnManual" onclick="switchTab('manual')">과목별 직접 추가</button>
                    <button class="tab-btn" id="tabBtnPaste" onclick="switchTab('paste')">여러 과목 일괄 붙여넣기</button>
                  </div>

                  <!-- 탭 1: 파일 업로드 -->
                  <div id="tabPanelFile">
                    <label class="dropzone" id="dropzone">
                      <div class="dropzone-title">📥 터치하여 선택한 과목으로 과세특 파일 추가</div>
                      <div class="dropzone-sub">한글(.hwp, .hwpx), 엑셀(.xlsx, .csv), PDF, 워드(.docx), TXT 모두 지원</div>
                      <input
                        type="file"
                        id="fileInput"
                        multiple
                        accept=".hwp,.hwpx,.xlsx,.xls,.csv,.pdf,.docx,.txt,.md,.json"
                        style="display:none"
                        onchange="handleFilesSelect(event)"
                      />
                    </label>
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
                      <label style="font-size:11.5px; color:var(--text-muted); display:flex; align-items:center; gap:4px; cursor:pointer;">
                        <input type="checkbox" id="useSelectedSubjectForFile" checked />
                        파일 내용을 위에서 선택한 과목(<strong><span id="currentSubjLabel">통합과학</span></strong>)으로 등록
                      </label>
                      <button class="btn btn-outline" style="padding:4px 9px; font-size:11.5px;" onclick="downloadSampleCSV()">CSV 양식 받기</button>
