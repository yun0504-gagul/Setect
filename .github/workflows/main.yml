              function loadSampleData() {
                const existing = new Set(records.map(r => r.topic));
                SAMPLE_RECORDS.forEach(s => {
                  if (!existing.has(s.topic)) {
                    records.unshift({ ...s, id: 'rec-' + Date.now() + Math.random().toString(36).slice(2, 6) });
