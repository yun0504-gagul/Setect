                  topic: '조건부확률과 베이즈 정리를 활용한 질병 진단 키트의 정확도 분석',
                  content: '조건부확률 단원에서 질병 유병률과 진단 키트의 민감도·특이도를 바탕으로 실제 감염 확률을 계산하는 베이즈 정리 탐구를 수행함. 유병률이 낮을 때 위양성 비율이 높아지는 역설을 수식으로 증명함.'
                }
              ];

              let records = [];

              window.addEventListener('DOMContentLoaded', () => {
                try {
                  const saved = localStorage.getItem(STORAGE_KEY);
                  records = saved ? JSON.parse(saved) : [...SAMPLE_RECORDS];
                } catch (e) {
                  records = [...SAMPLE_RECORDS];
                }
                setupDragAndDrop();
                renderAll();
              });

              function saveToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
              }

              function loadSampleData() {
                const existing = new Set(records.map(r => r.topic));
                SAMPLE_RECORDS.forEach(s => {
                  if (!existing.has(s.topic)) {
                    records.unshift({ ...s, id: 'rec-' + Date.now() + Math.random().toString(36).slice(2, 6) });
                  }
                });
                saveToStorage();
                renderAll();
                showStatus('예시 과세특 데이터가 불러와졌습니다.');
              }

              function extractKeywords(text) {
                if (!text) return [];
                const cleaned = text.toLowerCase().replace(/[^\w가-힣\s]/g, ' ').replace(/\s+/g, ' ').trim();
                const tokens = [];
                cleaned.split(' ').forEach(tok => {
                  if (!tok || tok.length < 2) return;
                  let stem = tok.replace(/(에서|으로|에게|부터|까지|하는|하고|하여|적인|들의|들을|들이|은|는|이|가|을|를|의|에|와|과|로|도|만|함)$/g, '');
                  if (stem.length < 2) stem = tok;
                  if (!STOPWORDS.has(stem) && !STOPWORDS.has(tok) && !/^\d+$/.test(stem)) {
                    tokens.push(stem);
                  }
                });
                return Array.from(new Set(tokens));
              }

              function getCharBigrams(str) {
                const s = (str || '').toLowerCase().replace(/\s+/g, '');
                const bigrams = new Set();
                for (let i = 0; i < s.length - 1; i++) bigrams.add(s.slice(i, i + 2));
                return bigrams;
              }

              function expandConceptTerms(keywords) {
                const expanded = new Set(keywords);
                keywords.forEach(kw => {
                  CONCEPT_CLUSTERS.forEach(cluster => {
                    if (cluster.some(c => kw.includes(c) || c.includes(kw))) {
                      cluster.forEach(c => expanded.add(c));
                    }
                  });
                });
                return expanded;
              }

              function evaluateMatch(queryText, record) {
                const queryKeywords = extractKeywords(queryText);
                const recordFullText = `${record.subject} ${record.topic} ${record.content}`;
                const recordKeywords = extractKeywords(recordFullText);
                const topicKeywords = extractKeywords(record.topic);

                if (queryKeywords.length === 0) return { score: 0, matchedWords: [], clusterMatched: [] };

                const matchedWords = [];
                const topicMatchedWords = [];

                queryKeywords.forEach(qkw => {
                  if (recordKeywords.some(rkw => rkw.includes(qkw) || qkw.includes(rkw)) || recordFullText.toLowerCase().includes(qkw)) {
                    matchedWords.push(qkw);
                  }
                  if (topicKeywords.some(tkw => tkw.includes(qkw) || qkw.includes(tkw)) || (record.topic || '').toLowerCase().includes(qkw)) {
                    topicMatchedWords.push(qkw);
                  }
                });

                const expandedQuery = expandConceptTerms(queryKeywords);
                const clusterMatched = recordKeywords.filter(rkw => !matchedWords.includes(rkw) && expandedQuery.has(rkw));

                const keywordRatio = matchedWords.length / queryKeywords.length;
                const topicBonus = topicMatchedWords.length / queryKeywords.length;

                const qBigrams = getCharBigrams(queryText);
                const tBigrams = getCharBigrams(record.topic);
                let bigramHits = 0;
                qBigrams.forEach(bg => { if (tBigrams.has(bg)) bigramHits++; });
                const bigramSim = qBigrams.size > 0 ? (2 * bigramHits) / (qBigrams.size + tBigrams.size) : 0;

                let rawScore = keywordRatio * 62 + topicBonus * 23 + Math.min(clusterMatched.length * 6, 18) + bigramSim * 25;
                if (matchedWords.length >= 2 && topicMatchedWords.length >= 2) rawScore = Math.max(rawScore, 76);
                else if (matchedWords.length >= 3) rawScore = Math.max(rawScore, 70);
                else if (matchedWords.length === 1 && queryKeywords.length === 1) rawScore = Math.max(rawScore, 72);

                return {
                  score: Math.min(100, Math.round(rawScore)),
                  matchedWords: Array.from(new Set(matchedWords)),
                  clusterMatched: Array.from(new Set(clusterMatched)).slice(0, 5)
                };
              }

              function generateDeepeningSuggestions(queryText, topMatches, targetSubj, careerTrack) {
                const qKeywords = extractKeywords(queryText);
                const mainKeyword = qKeywords.slice(0, 3).join(' · ') || queryText;
                const prevSubjects = Array.from(new Set(topMatches.map(m => m.record.subject))).join(', ');
                const nextSubjLabel = targetSubj ? `[${targetSubj}]` : '후속 과목';

                const suggestions = [];
                if (topMatches.length > 0) {
                  suggestions.push({
                    title: `① [수리·데이터 심화] 기존 '${prevSubjects}' 탐구를 수학적 모델링·실증 데이터로 검증`,
                    desc: `이미 ${prevSubjects}에서 '${mainKeyword}'의 개념을 다루었다면, ${nextSubjLabel}에서는 실제 통계 데이터셋 분석, 수식 유도, 또는 시뮬레이션 오차율 검증으로 주제를 한 단계 격상하세요.`
                  });
                } else {
                  suggestions.push({
                    title: `① [탐구 설계 고도화] '${mainKeyword}'의 원리 분석 + 실제 데이터 비교`,
                    desc: `단순 개념 정리에 그치지 않도록 '${mainKeyword}'의 핵심 메커니즘을 교과 단원 개념과 연결한 뒤, 실제 논문·통계 자료나 실험 대조군 데이터를 비교 분석하는 구조로 설계하세요.`
                  });
                }

                const trackMap = {
                  it: {
                    title: `② [IT·AI 확장] '${mainKeyword}' 문제 해결을 위한 알고리즘 최적화 및 코드 구현`,
                    desc: `기존 탐구에서 문제 현상을 짚었다면, 이번에는 Python 시뮬레이션, 가중치 보정 수식(Loss Function 설계), 또는 정확도·연산량 트레이드오프 실험으로 기술적 해법을 제시해 보세요.`
                  },
                  bio: {
                    title: `② [의학·간호·생명·화학 심화] 임상/분자 수준의 작용 기전 및 변인별 정량 비교`,
                    desc: `거시적인 현상 탐구를 넘어 분자 결합 구조, 체내 약물 반감기 수식, 환자 분류(트리아제) 프로토콜 기준, 또는 저해제·농도 변인에 따른 반응 속도 비교로 깊이 있게 확장해 보세요.`
                  },
                  eng: {
                    title: `② [공학·신소재 심화] 에너지 효율 한계 극복을 위한 공정 변수 및 물성 비교`,
                    desc: `이론적 원리가 실제 산업에 적용될 때 발생하는 열손실·내구성·수율 문제를 정의하고, 대체 소재나 구조 설계를 통한 정량적 개선 방안을 탐구해 보세요.`
                  },
                  soc: {
                    title: `② [경제·정책·사회 확장] '${mainKeyword}' 도입의 비용·편익 분석과 제도적 보완책`,
                    desc: `현상 설명에서 나아가 시장 실패 요인, 외부효과, 정보 비대칭성, 또는 해외 규제 사례와 국내 법제도 비교 분석으로 시야를 넓혀 보세요.`
                  },
                  hum: {
                    title: `② [인문·윤리·미디어 확장] 딜레마 상황에서의 윤리적 판단 기준과 담론 프레임 분석`,
                    desc: `이해관계자가 충돌하는 구체적 딜레마 사례를 설정하고, 윤리적 관점이나 미디어 프레임 비교를 통해 규범적 가이드라인을 도출해 보세요.`
                  },
                  all: {
                    title: `② [한계점 극복 & 역발상 탐구] '${mainKeyword}'의 예외 조건(한계점)과 최신 대안 분석`,
                    desc: `기존 세특에서 기본 작동 원리를 다뤘다면, 이번에는 반대로 '작동하지 않는 예외 조건(병목 현상, 오차 발생 요인)'을 집중 분석하고 이를 보완하는 대안 기술을 비교해 보세요.`
                  }
                };

                suggestions.push(trackMap[careerTrack] || trackMap.all);
                suggestions.push({
                  title: `③ [생기부 스토리라인 연결 팁] 중복이 아닌 '심화 연계'로 평가받는 문구 작성법`,
                  desc: `초안 첫 문장에 "이전 교과에서 다룬 [${mainKeyword}]의 한계점을 보완하고자 ${nextSubjLabel}의 교과 개념을 적용하여 후속 심화 탐구를 수행함"이라고 명시하면 전공 적합성과 탐구 지속성에서 높은 평가를 받습니다.`
                });

                return suggestions;
              }

              function checkTopic() {
                const query = document.getElementById('topicInput').value.trim();
                const targetSubj = document.getElementById('targetSubjectInput').value.trim();
                const careerTrack = document.getElementById('careerTrackSelect').value;
                const resultArea = document.getElementById('checkResultArea');

                if (!query) { resultArea.innerHTML = ''; return; }

                const evaluated = records
                  .map(rec => ({ record: rec, ...evaluateMatch(query, rec) }))
                  .filter(item => item.score >= 18)
                  .sort((a, b) => b.score - a.score);

                const topScore = evaluated.length > 0 ? evaluated[0].score : 0;

                let verdictClass = 'verdict-safe';
                let badgeText = '✅ 신규 탐구 가능 (겹치지 않는 새로운 주제입니다)';
                let summaryText = `등록된 ${records.length}건의 과세특과 비교한 결과, 중복되는 주제가 발견되지 않았습니다.`;

                if (topScore >= 65) {
                  verdictClass = 'verdict-danger';
                  badgeText = '🚨 이미 진행한 주제입니다! (높은 중복 감지)';
                  summaryText = `기존 과세특(${evaluated[0].record.grade} ${evaluated[0].record.subject})과 핵심 주제가 크게 겹칩니다. 아래의 심화·확장 제안으로 차별화하세요.`;
                } else if (topScore >= 32) {
                  verdictClass = 'verdict-warn';
                  badgeText = '⚠️ 유사 소재/키워드 이력 있음 (심화 연계 추천)';
                  summaryText = `관련된 소재나 키워드를 다룬 이력이 있습니다. 이전 탐구에서 한 단계 나아간 '후속 심화 탐구'로 연결해 보세요.`;
                }

                const suggestions = generateDeepeningSuggestions(query, evaluated.slice(0, 2), targetSubj, careerTrack);

                const matchesHtml = evaluated.length > 0 ? `
                  <div class="match-list">
                    ${evaluated.slice(0, 4).map(item => {
                      const hlTerms = [...item.matchedWords, ...item.clusterMatched];
                      return `
                        <div class="match-item">
                          <div class="match-meta">
                            <div>
                              <span class="tag tag-grade">${escapeHtml(item.record.grade)}</span>
                              <span class="tag">${escapeHtml(item.record.subject)}</span>
                            </div>
                            <strong style="font-size:12px; color:${item.score >= 65 ? 'var(--danger)' : 'var(--warn)'};">유사도 ${item.score}%</strong>
                          </div>
                          <div class="match-title">${highlightText(item.record.topic, hlTerms)}</div>
                          <div class="match-content">${highlightText(item.record.content, hlTerms)}</div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : '';

                const suggestionsHtml = `
                  <div class="suggestion-box">
                    <h3>💡 겹치지 않게 차별화하는 심화·확장 주제 제안</h3>
                    <div class="suggestion-list">
                      ${suggestions.map(s => `
                        <div class="suggestion-item">
                          <strong>${escapeHtml(s.title)}</strong>
                          <p>${escapeHtml(s.desc)}</p>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;

                resultArea.innerHTML = `
                  <div class="verdict-card ${verdictClass}">
                    <div class="verdict-header">
                      <span class="verdict-badge">${badgeText}</span>
                      <span class="verdict-score">최대 중복도 ${topScore}%</span>
                    </div>
                    <p style="font-size:13px;">${summaryText}</p>
                  </div>
                  ${matchesHtml}
                  ${suggestionsHtml}
                `;
              }

              function quickCheck(text) {
                document.getElementById('topicInput').value = text;
                checkTopic();
              }

              function highlightText(text, terms) {
                if (!text || !terms || terms.length === 0) return escapeHtml(text);
                let safe = escapeHtml(text);
                [...terms].filter(t => t.length >= 2).sort((a, b) => b.length - a.length).forEach(term => {
                  const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                  safe = safe.replace(new RegExp(`(${escaped})`, 'gi'), '<mark class="hl">$1</mark>');
                });
                return safe;
              }

              function switchTab(mode) {
                ['file', 'paste', 'manual'].forEach(m => {
                  const cap = m.charAt(0).toUpperCase() + m.slice(1);
                  document.getElementById('tabBtn' + cap).classList.toggle('active', m === mode);
                  document.getElementById('tabPanel' + cap).style.display = m === mode ? 'block' : 'none';
                });
              }

              function setupDragAndDrop() {
                const dz = document.getElementById('dropzone');
                ['dragenter', 'dragover'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.add('dragover'); }));
                ['dragleave', 'drop'].forEach(evt => dz.addEventListener(evt, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
                dz.addEventListener('drop', e => {
                  if (e.dataTransfer.files?.length) processUploadedFiles(e.dataTransfer.files);
                });
              }

              function handleFilesSelect(e) {
                if (e.target.files?.length) processUploadedFiles(e.target.files);
                e.target.value = '';
              }

              async function processUploadedFiles(fileList) {
                let totalAdded = 0;
                showStatus('파일 분석 중...');
                for (const file of fileList) {
                  const ext = file.name.split('.').pop().toLowerCase();
                  try {
                    if (['xlsx', 'xls', 'csv'].includes(ext)) totalAdded += await parseExcelOrCSVFile(file);
                    else if (ext === 'pdf') totalAdded += await parsePDFFile(file);
                    else if (ext === 'docx') totalAdded += await parseDocxFile(file);
                    else if (ext === 'hwpx') totalAdded += await parseHwpxFile(file);
                    else if (ext === 'hwp') totalAdded += await parseHwpFile(file);
                    else if (ext === 'json') {
                      const arr = JSON.parse(await file.text());
                      if (Array.isArray(arr)) arr.forEach(i => { addRecordObject(i.grade, i.subject, i.topic, i.content); totalAdded++; });
                    } else {
                      totalAdded += parseBulkTextToRecords(await file.text(), '파일등록', file.name.replace(/\.[^.]+$/, ''));
                    }
                  } catch (err) {
                    showStatus(`오류 (${file.name}): ${err.message}`);
                  }
                }
                saveToStorage();
                renderAll();
                showStatus(`✅ 총 ${totalAdded}건의 과세특이 등록되었습니다.`);
                if (document.getElementById('topicInput').value) checkTopic();
              }

              // 1) 한글 표준 포맷(.hwpx) 파서 — ZIP 내부 Contents/section*.xml 본문 및 표 추출
              async function parseHwpxFile(file) {
                if (!window.JSZip) throw new Error('JSZip 라이브러리를 불러오지 못했습니다.');
                const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
                const sectionFiles = Object.keys(zip.files)
                  .filter(name => /^Contents\/section\d+\.xml$/i.test(name) || (/\.xml$/i.test(name) && name.toLowerCase().includes('section')))
                  .sort();

                let extractedLines = [];
                const parser = new DOMParser();

                for (const path of sectionFiles) {
                  const xmlStr = await zip.files[path].async('string');
                  const xmlDoc = parser.parseFromString(xmlStr, 'text/xml');
                  const paragraphs = Array.from(xmlDoc.getElementsByTagName('*')).filter(el => el.localName === 'p');
                  if (paragraphs.length > 0) {
                    paragraphs.forEach(p => {
                      const texts = Array.from(p.getElementsByTagName('*'))
                        .filter(el => el.localName === 't')
                        .map(t => t.textContent || '')
                        .join('');
                      if (texts.trim()) extractedLines.push(texts.trim());
                    });
                  } else {
                    const plain = xmlStr.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                    if (plain) extractedLines.push(plain);
                  }
                }

                const fullText = extractedLines.join('\n');
                if (!fullText.trim()) throw new Error('HWPX 파일에서 텍스트를 찾지 못했습니다.');
                return parseBulkTextToRecords(fullText, '한글(HWPX)', file.name.replace(/\.[^.]+$/, ''));
              }

              // 2) 구형 한글 포맷(.hwp, HWP 5.0 OLE 복합문서) 파서 — BodyText/Section 및 PrvText 디코딩
              async function parseHwpFile(file) {
                const buf = new Uint8Array(await file.arrayBuffer());

                // 확장자는 .hwp지만 실제로는 ZIP 기반 .hwpx인 경우 자동 처리
                if (buf[0] === 0x50 && buf[1] === 0x4B) {
                  return await parseHwpxFile(file);
                }

                if (!window.CFB) throw new Error('HWP 파서(CFB)를 불러오지 못했습니다.');
                const cfb = window.CFB.read(buf, { type: 'array' });

                let compressed = true;
                const fileHeaderEntry = window.CFB.find(cfb, 'FileHeader');
                if (fileHeaderEntry && fileHeaderEntry.content && fileHeaderEntry.content.length >= 40) {
                  const flags = fileHeaderEntry.content[36];
                  compressed = (flags & 0x01) !== 0;
                }

                const paragraphs = [];

                // BodyText/Section0, Section1 ... 스트림에서 HWPTAG_PARA_TEXT (Tag ID 67) 추출
                const sectionEntries = (cfb.FileIndex || []).filter(e => e.name && /^Section\d+$/i.test(e.name));
                for (const entry of sectionEntries) {
                  try {
                    let raw = entry.content instanceof Uint8Array ? entry.content : new Uint8Array(entry.content || []);
                    if (!raw.length) continue;
                    if (compressed && window.pako) {
                      try {
                        raw = window.pako.inflateRaw(raw);
                      } catch (e1) {
                        try { raw = window.pako.inflate(raw); } catch (e2) {}
                      }
                    }
                    const sectionParas = extractHwpSectionText(raw);
                    if (sectionParas.length) paragraphs.push(...sectionParas);
                  } catch (secErr) {}
                }

                // PrvText(미리보기 텍스트 UTF-16LE) 보조 추출
                const prvEntry = window.CFB.find(cfb, 'PrvText');
                if (paragraphs.length === 0 && prvEntry && prvEntry.content) {
                  const u8 = prvEntry.content instanceof Uint8Array ? prvEntry.content : new Uint8Array(prvEntry.content);
                  const prvText = new TextDecoder('utf-16le').decode(u8).replace(/\u0000/g, '').trim();
                  if (prvText) paragraphs.push(prvText);
                }

                const combinedText = paragraphs.join('\n').trim();
                if (!combinedText) throw new Error('암호화되었거나 텍스트를 추출할 수 없는 HWP 파일입니다.');
                return parseBulkTextToRecords(combinedText, '한글(HWP)', file.name.replace(/\.[^.]+$/, ''));
              }

              // HWP 5.0 레코드 스트림에서 HWPTAG_PARA_TEXT(Tag 67) UTF-16LE 문자열 디코딩
              function extractHwpSectionText(u8) {
                const result = [];
                const view = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
                let offset = 0;

                while (offset + 4 <= u8.byteLength) {
                  const header = view.getUint32(offset, true);
                  offset += 4;
                  const tagId = header & 0x3FF;
                  let size = (header >>> 20) & 0xFFF;

                  if (size === 0xFFF) {
                    if (offset + 4 > u8.byteLength) break;
                    size = view.getUint32(offset, true);
                    offset += 4;
                  }
                  if (offset + size > u8.byteLength) break;

                  // 67 = HWPTAG_PARA_TEXT
                  if (tagId === 67 && size >= 2) {
                    let text = '';
                    let pos = offset;
                    const end = offset + size;
                    while (pos + 2 <= end) {
                      const code = view.getUint16(pos, true);
                      pos += 2;
                      if (code === 0) break;
                      if (code < 32) {
                        if ([1, 2, 3, 11, 12, 14, 15, 16, 17, 18, 21, 22, 23].includes(code)) {
                          pos += 14;
                        } else if ([4, 5, 6, 7, 8, 9, 19, 20].includes(code)) {
                          pos += 14;
                        } else if (code === 10 || code === 13) {
                          text += '\n';
                        }
                        continue;
                      }
                      text += String.fromCharCode(code);
                    }
                    const cleaned = text.replace(/\s+/g, ' ').trim();
                    if (cleaned) result.push(cleaned);
                  }
                  offset += size;
                }
                return result;
              }

              async function parseExcelOrCSVFile(file) {
                if (!window.XLSX) return parseBulkTextToRecords(await file.text(), 'CSV', '교과세특');
                const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
                let added = 0;
                wb.SheetNames.forEach(name => {
                  const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' });
                  rows.forEach(row => {
                    const keys = Object.keys(row);
                    const getCol = cands => {
                      const k = keys.find(key => cands.some(c => key.toLowerCase().includes(c)));
                      return k ? String(row[k]).trim() : '';
                    };
                    const grade = getCol(['학년', '학기', 'grade']) || name;
                    const subject = getCol(['과목', '교과', 'subject']) || '교과세특';
                    const topic = getCol(['주제', '제목', '탐구', 'topic', 'title']);
                    const content = getCol(['내용', '세특', '세부능력', '특기사항', '본문', 'content']) ||
                      Object.values(row).map(v => String(v).trim()).filter(v => v.length > 15).join(' ');
                    if (content || topic) { addRecordObject(grade, subject, topic, content || topic); added++; }
                  });
                });
                return added;
              }

              async function parsePDFFile(file) {
                const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const content = await page.getTextContent();
                  text += content.items.map(it => it.str).join(' ') + '\n';
                }
                return parseBulkTextToRecords(text, 'PDF등록', '생기부PDF');
              }

              async function parseDocxFile(file) {
                const res = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
                return parseBulkTextToRecords(res.value, '워드등록', '과세특문서');
              }

              function parseBulkTextToRecords(rawText, defaultGrade, defaultSubject) {
                const lines = (rawText || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
                const subjRegex = /^(?:\[([^\]]+)\]|([가-힣A-Za-z0-9\sⅠⅡⅢIV·]{2,18})\s*[:：\-])\s*(.+)$/;
                let currentSubj = defaultSubject || '교과세특';
                let buffer = [];
                let added = 0;

                const flush = () => {
                  const combined = buffer.join(' ').trim();
                  if (combined.length >= 8) { addRecordObject(defaultGrade, currentSubj, '', combined); added++; }
                  buffer = [];
                };

                lines.forEach(line => {
                  const m = line.match(subjRegex);
                  if (m) { flush(); currentSubj = (m[1] || m[2]).trim(); buffer.push(m[3].trim()); }
                  else buffer.push(line);
                });
                flush();
                return added;
              }

              function parseAndAddBulkText() {
                const text = document.getElementById('bulkPasteArea').value;
                const grade = document.getElementById('bulkGradeInput').value.trim() || '기타';
                const subj = document.getElementById('bulkDefaultSubj').value.trim() || '교과세특';
                if (!text.trim()) return alert('내용을 입력해 주세요.');
                const count = parseBulkTextToRecords(text, grade, subj);
                document.getElementById('bulkPasteArea').value = '';
                saveToStorage();
                renderAll();
                showStatus(`✅ ${count}건의 과세특이 등록되었습니다.`);
              }

              function addManualRecord() {
                const grade = document.getElementById('manualGrade').value.trim() || '기타';
                const subject = document.getElementById('manualSubject').value.trim() || '교과세특';
                const topic = document.getElementById('manualTopic').value.trim();
                const content = document.getElementById('manualContent').value.trim();
                if (!content && !topic) return alert('주제나 내용을 입력해 주세요.');
                addRecordObject(grade, subject, topic, content || topic);
                document.getElementById('manualTopic').value = '';
                document.getElementById('manualContent').value = '';
                saveToStorage();
                renderAll();
              }

              function addRecordObject(grade, subject, topic, content) {
                const cleanContent = (content || '').trim();
                let cleanTopic = (topic || '').trim();
                if (!cleanTopic && cleanContent) {
                  const first = cleanContent.split(/[.?!。]|함\.|음\./)[0].trim();
                  cleanTopic = first.length > 50 ? first.slice(0, 50) + '...' : first;
                }
                records.unshift({
                  id: 'rec-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                  grade: grade || '학년미상',
                  subject: subject || '교과세특',
                  topic: cleanTopic,
                  content: cleanContent
                });
              }

              function deleteRecord(id) {
                records = records.filter(r => r.id !== id);
                saveToStorage();
                renderAll();
                if (document.getElementById('topicInput').value) checkTopic();
              }

              function clearAllRecords() {
                if (!confirm('등록된 모든 과세특을 초기화하시겠습니까?')) return;
                records = [];
                saveToStorage();
                renderAll();
                document.getElementById('checkResultArea').innerHTML = '';
              }

              function renderAll() {
                renderRecordsList();
                renderKeywordCloud();
              }

              function renderRecordsList() {
                document.getElementById('recordCount').textContent = records.length;
                const filter = (document.getElementById('recordFilterInput')?.value || '').trim().toLowerCase();
                const filtered = records.filter(r =>
                  !filter ||
                  (r.subject || '').toLowerCase().includes(filter) ||
                  (r.topic || '').toLowerCase().includes(filter) ||
                  (r.content || '').toLowerCase().includes(filter)
                );

                const container = document.getElementById('recordsContainer');
                if (filtered.length === 0) {
                  container.innerHTML = `<div style="text-align:center; padding:24px; color:var(--text-muted); font-size:13px;">등록된 과세특이 없습니다.</div>`;
                  return;
                }

                container.innerHTML = filtered.map(rec => {
                  const kws = extractKeywords(rec.topic + ' ' + rec.content).slice(0, 5);
                  return `
                    <div class="record-card">
                      <div class="match-meta">
                        <div>
                          <span class="tag tag-grade">${escapeHtml(rec.grade)}</span>
                          <span class="tag">${escapeHtml(rec.subject)}</span>
                        </div>
                        <button class="record-del" onclick="deleteRecord('${rec.id}')">✕ 삭제</button>
                      </div>
                      <div class="match-title" style="cursor:pointer;" onclick="quickCheck('${escapeJs(rec.topic)}')">${escapeHtml(rec.topic)}</div>
                      <div class="match-content">${escapeHtml(rec.content)}</div>
                      <div class="keywords-row">
                        ${kws.map(k => `<button class="kw-chip" onclick="quickCheck('${escapeJs(k)}')">#${escapeHtml(k)}</button>`).join('')}
                      </div>
                    </div>
                  `;
                }).join('');
              }

              function renderKeywordCloud() {
                const freq = {};
                records.forEach(r => extractKeywords(`${r.topic} ${r.content}`).forEach(k => { freq[k] = (freq[k] || 0) + 1; }));
                const top = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 24);
                const cloud = document.getElementById('keywordCloud');
                cloud.innerHTML = top.length
                  ? top.map(([k, c]) => `<button class="kw-chip" onclick="quickCheck('${escapeJs(k)}')">#${escapeHtml(k)} (${c})</button>`).join('')
                  : `<span style="font-size:12.5px; color:var(--text-muted);">과세특을 등록하면 주요 키워드가 표시됩니다.</span>`;
              }

              function exportBackupJSON() {
                const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `seteuk_backup_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
              }

              async function importBackupJSON(e) {
                const file = e.target.files[0];
                if (!file) return;
                try {
                  const data = JSON.parse(await file.text());
                  if (Array.isArray(data)) { records = data; saveToStorage(); renderAll(); }
                } catch (err) { alert('유효한 JSON 파일이 아닙니다.'); }
                e.target.value = '';
              }

              function downloadSampleCSV() {
                const csv = '\uFEFF학년,과목,주제,내용\n1학년 1학기,통합사회,인공지능 추천 알고리즘의 윤리적 편향성,"빅데이터와 인공지능 추천 알고리즘이 미디어 소비에 미치는 영향을 분석함."\n';
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
                a.download = '과세특_등록양식.csv';
                a.click();
              }

              function showStatus(msg) {
                const el = document.getElementById('uploadStatus');
                el.textContent = msg;
                setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 4000);
              }

              function escapeHtml(s) {
                return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
              }
              function escapeJs(s) {
                return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
              }
            </script>
          </body>
          </html>
          EOF_HTML
          cp www/index.html index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android APK via Capacitor 6
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SeTeukCheck" "com.seteukcheck.app" --web-dir www
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact (app-debug.apk)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Web App Artifact (index.html)
        uses: actions/upload-artifact@v4
        with:
          name: seteuk-checker-web
          path: www/index.html
