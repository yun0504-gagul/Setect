name: Build SeTeukCheck APK & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate App Source Files (www/index.html)
        run: |
          mkdir -p www
          cat << 'EOF_HTML' > www/index.html
          <!DOCTYPE html>
          <html lang="ko">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
            <meta name="theme-color" content="#1e3a8a" />
            <title>세특체크 — 과세특 중복 판별 & 심화 주제 추천 앱</title>
            <!-- 다중 파일 파서 (Excel, DOCX, PDF, HWP/HWPX) -->
            <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/cfb@1.2.2/cfb.min.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
            <style>
              :root {
                --bg: #f8fafc;
                --surface: #ffffff;
                --surface-subtle: #f1f5f9;
                --border: #e2e8f0;
                --text: #0f172a;
                --text-muted: #475569;
                --primary: #2563eb;
                --primary-hover: #1d4ed8;
                --primary-soft: #dbeafe;
                --danger: #dc2626;
                --danger-soft: #fef2f2;
                --danger-border: #fecaca;
                --warn: #d97706;
                --warn-soft: #fffbeb;
                --warn-border: #fde68a;
                --safe: #059669;
                --safe-soft: #ecfdf5;
                --safe-border: #a7f3d0;
                --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
                --radius: 14px;
              }

              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
              body {
                font-family: system-ui, -apple-system, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.6;
                min-height: 100vh;
                padding-bottom: 40px;
              }

              header {
                background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
                color: #fff;
                padding: 20px 16px;
                position: sticky;
                top: 0;
                z-index: 50;
                box-shadow: 0 2px 12px rgba(15, 23, 42, 0.2);
              }
              .header-inner {
                max-width: 1160px;
                margin: 0 auto;
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
              }
              .brand { display: flex; align-items: center; gap: 11px; }
              .brand-badge {
                width: 38px; height: 38px; border-radius: 10px;
                background: #3b82f6; display: flex; align-items: center; justify-content: center;
                font-weight: 800; font-size: 18px; flex-shrink: 0;
              }
              .brand h1 { font-size: 19px; font-weight: 800; }
              .brand p { font-size: 12px; color: #cbd5e1; }
              .header-actions { display: flex; gap: 6px; flex-wrap: wrap; }

              .btn {
                display: inline-flex; align-items: center; justify-content: center; gap: 5px;
                padding: 8px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 600;
                cursor: pointer; border: 1px solid transparent; transition: 0.15s;
              }
              .btn-primary { background: var(--primary); color: #fff; }
              .btn-primary:hover { background: var(--primary-hover); }
              .btn-glass { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.22); }
              .btn-outline { background: #fff; color: var(--text); border-color: var(--border); }
              .btn-danger-outline { background: #fff; color: var(--danger); border-color: var(--danger-border); }

              .container {
                max-width: 1160px;
                margin: 18px auto 40px;
                padding: 0 14px;
                display: grid;
                grid-template-columns: 1.15fr 0.85fr;
                gap: 18px;
                align-items: start;
              }
              @media (max-width: 920px) { .container { grid-template-columns: 1fr; } }

              .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 18px;
                margin-bottom: 16px;
              }
              .card-title {
                font-size: 16px; font-weight: 700; margin-bottom: 6px;
                display: flex; align-items: center; justify-content: space-between; gap: 8px;
              }
              .card-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 13px; }

              .search-box { display: flex; flex-direction: column; gap: 10px; }
              .search-input-wrap { display: flex; gap: 8px; }
              .search-input {
                flex: 1; padding: 12px 14px; font-size: 15px;
                border: 2px solid var(--border); border-radius: 11px; outline: none;
              }
              .search-input:focus { border-color: var(--primary); }
              .search-options {
                display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
                font-size: 12.5px; color: var(--text-muted);
              }
              .search-options select, .search-options input {
                padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 12.5px; background: #fff;
              }

              .verdict-card { border-radius: 12px; padding: 15px 16px; margin-top: 14px; border: 1px solid transparent; }
              .verdict-danger { background: var(--danger-soft); border-color: var(--danger-border); color: #7f1d1d; }
              .verdict-warn { background: var(--warn-soft); border-color: var(--warn-border); color: #78350f; }
              .verdict-safe { background: var(--safe-soft); border-color: var(--safe-border); color: #064e3b; }
              .verdict-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
              .verdict-badge { font-weight: 800; font-size: 14.5px; }
              .verdict-score { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,0.8); }

              .match-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
              .match-item, .record-card {
                background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 13px;
              }
              .match-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
              .tag {
                display: inline-block; padding: 2px 8px; border-radius: 6px;
                font-size: 11.5px; font-weight: 700; background: var(--primary-soft); color: var(--primary);
              }
              .tag-grade { background: #e2e8f0; color: #334155; }
              .match-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
              .match-content { font-size: 13px; color: var(--text-muted); }
              mark.hl { background: #fef08a; color: #713f12; font-weight: 700; padding: 0 3px; border-radius: 3px; }

              .suggestion-box {
                margin-top: 14px; background: #f8fafc; border: 1px solid #cbd5e1;
                border-radius: 12px; padding: 14px;
              }
              .suggestion-box h3 { font-size: 14px; font-weight: 800; color: #1e3a8a; margin-bottom: 9px; }
              .suggestion-list { display: flex; flex-direction: column; gap: 9px; }
              .suggestion-item {
                background: #fff; border-left: 4px solid var(--primary);
                padding: 10px 12px; border-radius: 8px;
              }
              .suggestion-item strong { display: block; font-size: 13px; margin-bottom: 2px; }
              .suggestion-item p { font-size: 12.5px; color: var(--text-muted); }

              .dropzone {
                display: block; border: 2px dashed #94a3b8; border-radius: 12px;
                padding: 18px 12px; text-align: center; background: #f8fafc;
                cursor: pointer; transition: 0.15s; margin-bottom: 10px;
              }
              .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: #eff6ff; }
              .dropzone-title { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; }
              .dropzone-sub { font-size: 11.5px; color: var(--text-muted); }

              .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
              .tab-btn {
                padding: 7px 10px; font-size: 12.5px; font-weight: 700; color: var(--text-muted);
                background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer;
              }
              .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

              .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
              .input, .textarea {
                width: 100%; padding: 8px 11px; border: 1px solid var(--border);
                border-radius: 8px; font-size: 13px; font-family: inherit;
              }
              .textarea { min-height: 90px; resize: vertical; margin-bottom: 8px; }

              .records-scroll {
                max-height: 440px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
              }
              .record-del {
                background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 12px; font-weight: 700;
              }
              .record-del:hover { color: var(--danger); }

              .keywords-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
              .kw-chip {
                font-size: 11px; padding: 3px 8px; border-radius: 999px;
                background: var(--surface-subtle); color: #334155; cursor: pointer; border: 1px solid var(--border);
              }
              .kw-chip:hover { background: var(--primary-soft); color: var(--primary); }

              .status-toast { font-size: 12px; color: var(--primary); font-weight: 600; margin-top: 6px; min-height: 18px; }
            </style>
          </head>
          <body>
            <header>
              <div class="header-inner">
                <div class="brand">
                  <div class="brand-badge">세</div>
                  <div>
                    <h1>세특체크 (SeTeuk Check)</h1>
                    <p>과세특 파일 등록 · 주제 중복 판별 · 계열별 심화 확장 추천</p>
                  </div>
                </div>
                <div class="header-actions">
                  <button class="btn btn-glass" onclick="loadSampleData()">✨ 예시 불러오기</button>
                  <button class="btn btn-glass" onclick="exportBackupJSON()">💾 JSON 백업</button>
                  <label class="btn btn-glass" style="cursor:pointer;">
                    📂 백업 복원
                    <input type="file" accept=".json" style="display:none" onchange="importBackupJSON(event)" />
                  </label>
                </div>
              </div>
            </header>

            <main class="container">
              <!-- 좌측: 주제 중복 검사 및 심화 추천 -->
              <section>
                <div class="card">
                  <div class="card-title">
                    <span>🔍 새 탐구 주제 중복 검사 & 심화 추천</span>
                  </div>
                  <p class="card-desc">
                    새로 계획 중인 보고서·발표 주제를 입력하면 등록된 과세특 전체와 비교해 중복 여부를 알려주고, 겹치지 않는 후속 심화 주제를 제안합니다.
                  </p>

                  <div class="search-box">
                    <div class="search-input-wrap">
                      <input
                        type="text"
                        id="topicInput"
                        class="search-input"
                        placeholder="예: 인공지능 추천 알고리즘 편향성, 효소 반응 속도 실험..."
                        onkeydown="if(event.key==='Enter') checkTopic()"
                      />
                      <button class="btn btn-primary" onclick="checkTopic()">검사</button>
                    </div>

                    <div class="search-options">
                      <label>대상 과목:</label>
                      <input type="text" id="targetSubjectInput" placeholder="예: 확률과 통계, 생명과학II" style="width:165px;" />
                      <label>희망 계열:</label>
                      <select id="careerTrackSelect" onchange="if(document.getElementById('topicInput').value) checkTopic()">
                        <option value="all">전체 / 융합 계열</option>
                        <option value="it">IT · 컴퓨터 · AI · 데이터</option>
                        <option value="bio">의학 · 간호 · 약학 · 생명 · 화학</option>
                        <option value="eng">기계 · 전자 · 신소재 · 공학</option>
                        <option value="soc">경영 · 경제 · 사회 · 법학</option>
                        <option value="hum">인문 · 교육 · 미디어 · 어문</option>
                      </select>
                    </div>

                    <div style="display:flex; gap:5px; flex-wrap:wrap; align-items:center;">
                      <span style="font-size:11.5px; color:var(--text-muted);">빠른 테스트:</span>
                      <button class="kw-chip" onclick="quickCheck('인공지능 추천 알고리즘의 윤리적 편향성')">인공지능 알고리즘 편향성</button>
                      <button class="kw-chip" onclick="quickCheck('조건부확률과 베이즈 정리를 활용한 질병 진단')">베이즈 정리 질병 진단</button>
                      <button class="kw-chip" onclick="quickCheck('카탈레이스 효소 반응 속도와 온도·pH 영향')">효소 반응 속도 실험</button>
                    </div>
                  </div>

                  <div id="checkResultArea"></div>
                </div>

                <div class="card">
                  <div class="card-title">
                    <span>📊 내가 이미 탐구한 핵심 키워드 맵</span>
                    <span style="font-size:11.5px; color:var(--text-muted); font-weight:400;">터치 시 즉시 검사</span>
                  </div>
                  <div id="keywordCloud" class="keywords-row"></div>
                </div>
              </section>

              <!-- 우측: 파일 등록 및 과세특 목록 -->
              <aside>
                <div class="card">
                  <div class="card-title">📂 과세특 파일 등록 / 텍스트 추가</div>
                  <p class="card-desc">
                    한글(HWP/HWPX), 엑셀(XLSX/CSV), 워드(DOCX), 생기부 PDF, 텍스트(TXT) 파일을 올리거나 생기부 원문을 그대로 붙여넣으세요. 기기 내부에 자동 저장됩니다.
                  </p>

                  <div class="tabs">
                    <button class="tab-btn active" id="tabBtnFile" onclick="switchTab('file')">파일 업로드</button>
                    <button class="tab-btn" id="tabBtnPaste" onclick="switchTab('paste')">텍스트 붙여넣기</button>
                    <button class="tab-btn" id="tabBtnManual" onclick="switchTab('manual')">1건씩 입력</button>
                  </div>

                  <!-- 탭 1: 파일 업로드 -->
                  <div id="tabPanelFile">
                    <label class="dropzone" id="dropzone">
                      <div class="dropzone-title">📥 터치하여 과세특 파일 선택 (여러 개 가능)</div>
                      <div class="dropzone-sub">지원 형식: .hwp, .hwpx, .xlsx, .xls, .csv, .pdf, .docx, .txt, .json</div>
                      <input
                        type="file"
                        id="fileInput"
                        multiple
                        accept=".hwp,.hwpx,.xlsx,.xls,.csv,.pdf,.docx,.txt,.md,.json"
                        style="display:none"
                        onchange="handleFilesSelect(event)"
                      />
                    </label>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span style="font-size:11.5px; color:var(--text-muted);">* 한글(.hwp/.hwpx) 표·본문 자동 추출 지원</span>
                      <button class="btn btn-outline" style="padding:4px 9px; font-size:11.5px;" onclick="downloadSampleCSV()">CSV 양식 받기</button>
                    </div>
                    <div id="uploadStatus" class="status-toast"></div>
                  </div>

                  <!-- 탭 2: 텍스트 일괄 붙여넣기 -->
                  <div id="tabPanelPaste" style="display:none;">
                    <div class="form-row">
                      <input type="text" id="bulkGradeInput" class="input" placeholder="학년/학기" value="2학년 1학기" />
                      <input type="text" id="bulkDefaultSubj" class="input" placeholder="기본 과목명" value="교과세특" />
                    </div>
                    <textarea
                      id="bulkPasteArea"
                      class="textarea"
                      placeholder="과목명: 세특 내용 형태로 붙여넣으면 과목별로 자동 분리됩니다.&#10;예시:&#10;수학I: 지수함수와 로그함수를 활용하여 지진 규모를 분석함.&#10;생명과학I: 카탈레이스 효소 반응 속도 실험을 수행함."
                    ></textarea>
                    <button class="btn btn-primary" style="width:100%;" onclick="parseAndAddBulkText()">텍스트 자동 분리 및 등록</button>
                  </div>

                  <!-- 탭 3: 직접 입력 -->
                  <div id="tabPanelManual" style="display:none;">
                    <div class="form-row">
                      <input type="text" id="manualGrade" class="input" placeholder="학년/학기 (예: 1학년 2학기)" />
                      <input type="text" id="manualSubject" class="input" placeholder="과목명 (예: 통합과학)" />
                    </div>
                    <input type="text" id="manualTopic" class="input" style="margin-bottom:8px;" placeholder="핵심 탐구 주제 (비워두면 본문에서 자동 요약)" />
                    <textarea id="manualContent" class="textarea" placeholder="과세특 본문 내용을 입력하세요."></textarea>
                    <button class="btn btn-primary" style="width:100%;" onclick="addManualRecord()">과세특 등록하기</button>
                  </div>
                </div>

                <div class="card">
                  <div class="card-title">
                    <span>📚 등록된 내 과세특 (<span id="recordCount">0</span>건)</span>
                    <button class="btn btn-danger-outline" style="padding:4px 9px; font-size:11.5px;" onclick="clearAllRecords()">전체 초기화</button>
                  </div>
                  <input
                    type="text"
                    id="recordFilterInput"
                    class="input"
                    style="margin-bottom:10px;"
                    placeholder="등록된 목록 내 과목/키워드 검색..."
                    oninput="renderRecordsList()"
                  />
                  <div class="records-scroll" id="recordsContainer"></div>
                </div>
              </aside>
            </main>

            <script>
              if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc =
                  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              }

              const STORAGE_KEY = 'seteuk_checker_records_v1';

              const STOPWORDS = new Set([
                '통해','대한','대해','관한','활용','활용한','활용하여','바탕으로','중심으로',
                '탐구','탐구함','조사','조사함','발표','발표함','보고서','작성','작성함',
                '이해','이해함','분석','분석함','설명','설명함','제시','제시함','도출',
                '수업','시간','교과','과목','단원','개념','원리','과정','결과','모습',
                '보임','보여줌','뛰어남','우수함','적극적','참여','태도','학생','주제',
                '선정','선정하여','관련','연계','심화','확장','다양한','구체적','논리적'
              ]);

              const CONCEPT_CLUSTERS = [
                ['인공지능','ai','머신러닝','딥러닝','기계학습','신경망','알고리즘','챗gpt','생성형'],
                ['편향','편향성','윤리','공정성','차별','필터버블','확증편향'],
                ['확률','조건부확률','베이즈','베이즈정리','통계','위양성','거짓양성','진단키트','민감도'],
                ['효소','카탈레이스','아밀레이스','반응속도','활성화에너지','촉매','기질','온도','ph'],
                ['유전자','dna','rna','mrna','크리스퍼','유전자가위','백신','지질나노입자','lnp'],
                ['기후변화','탄소중립','온실가스','탄소배출','신재생에너지','탄소국경세','cbam','esg'],
                ['지수','로그','지수함수','로그함수','리히터','데시벨','반감기'],
                ['간호','환자','바이탈','의료','임상','돌봄','트리아제','응급']
              ];

              const SAMPLE_RECORDS = [
                {
                  id: 'sample-1',
                  grade: '1학년 1학기',
                  subject: '통합사회',
                  topic: '인공지능 추천 알고리즘의 필터버블과 윤리적 편향성',
                  content: '빅데이터와 인공지능 추천 알고리즘이 미디어 소비에 미치는 영향을 주제로 선정하여 필터버블과 확증편향 현상을 심층 분석함. 데이터 편향성으로 인해 발생하는 사회적 차별 사례를 조사하고 알고리즘 투명성 확보 방안을 발표함.'
                },
                {
                  id: 'sample-2',
