                  content: '지수함수와 로그함수가 자연현상을 측정하는 척도로 활용되는 원리에 호기심을 갖고 리히터 지진 규모 공식과 방사성 동위원소의 반감기 수식을 유도함.'
                },
                {
                  id: 'sample-4',
